plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.brucelet.spacetrader'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.brucelet.spacetrader'
        minSdk = 21
        targetSdk = 36
        // Archville rebuilds: versionCode = upstream * 1000 + Archville revision
        versionCode = 23001
        versionName = '1.3.5-archville1'
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        abortOnError = false
    }

    dependenciesInfo {
        // F-Droid cannot verify the encrypted Google dependency blob
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
