// Single-module build over the original Ant/Eclipse layout (manifest, src/, res/, assets/ at the root).
plugins {
    id 'com.android.application' version '9.4.1'
}

android {
    namespace = 'com.watabou.pixeldungeon'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.watabou.pixeldungeon'
        minSdk = 21
        targetSdk = 36
        // Archville rebuilds: versionCode = upstream * 1000 + Archville revision
        versionCode = 74001
        versionName = '1.9.1-archville1'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        encoding = 'ISO-8859-1'
    }

    lint {
        abortOnError = false
    }

    dependenciesInfo {
        // F-Droid cannot verify the encrypted Google dependency blob
        includeInApk = false
        includeInBundle = false
    }
}
