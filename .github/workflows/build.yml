# Build-check every app (unsigned release builds). Publishing is done from a
# maintainer machine with scripts/publish.sh, so no signing keys live on GitHub.
name: Build apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build release APKs
        run: |
          for app in apps/*/; do
            echo "::group::$app"
            (cd "$app" && ./gradlew --no-daemon --console=plain assembleRelease)
            echo "::endgroup::"
          done
